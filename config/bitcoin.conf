# Bitcoin Knots on a phone. Validates every signature from the genesis block, keeps recent blocks only.
server=1
assumevalid=0
prune=4000
dbcache=3000
maxmempool=100
maxconnections=24
listen=0
# Knots tries to launch a tor program when no Tor control port answers, and that path trips Android's
# file descriptor checks (fdsan) and aborts the node. Eddy doesn't bundle Tor yet.
listenonion=0
upnp=0
natpmp=0
disablewallet=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333
